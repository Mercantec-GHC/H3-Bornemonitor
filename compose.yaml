services:
  backend:
    build: ./backend/Bornemonitor.Api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      Mqtt__Host: ${MQTT_HOST}
      Mqtt__Username: ${MQTT_USERNAME}
      Mqtt__Password: ${MQTT_PASSWORD}
      ConnectionStrings__Neon: ${NEON_CONNECTION}

# Use the network that Dokploy already has, instead of creating a new one
networks:
  default:
    external: true
    name: dokploy-network
