<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="Helvetica, Arial, sans-serif">
<title>Børnemonitor – MQTT publish / subscribe</title>
<defs><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
.t{font-size:14px;font-weight:500}.s{font-size:12px}
.pub{stroke:#D85A30;stroke-width:1.5}.sub{stroke:#1D9E75;stroke-width:1.2;stroke-dasharray:4 3}
.topic{fill:#ffffff;stroke:#888780;stroke-width:.5}
</style>
<rect width="680" height="410" fill="#ffffff"/>
<rect x="245" y="45" width="190" height="320" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="t" x="340" y="75" text-anchor="middle" fill="#444441">EMQX broker</text>
<g fill="#2C2C2A" text-anchor="middle" class="s">
<rect class="topic" x="260" y="115" width="160" height="30" rx="4"/><text x="340" y="134">child/telemetry</text>
<rect class="topic" x="260" y="165" width="160" height="30" rx="4"/><text x="340" y="184">child/event/duration</text>
<rect class="topic" x="260" y="215" width="160" height="30" rx="4"/><text x="340" y="234">child/event/instant</text>
<rect class="topic" x="260" y="265" width="160" height="30" rx="4"/><text x="340" y="284">alarm</text>
<rect class="topic" x="260" y="315" width="160" height="30" rx="4"/><text x="340" y="334">settings (retained)</text>
</g>
<rect x="20" y="100" width="130" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width=".5"/>
<text class="t" x="85" y="123" text-anchor="middle" fill="#72243E">Child unit</text>
<text class="s" x="85" y="142" text-anchor="middle" fill="#993556">Arduino</text>
<text class="s" x="20" y="176" fill="#5F5E5A">Buttons: sleep, walk,</text>
<text class="s" x="20" y="191" fill="#5F5E5A">eat, diaper</text>
<rect x="20" y="300" width="130" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width=".5" stroke-dasharray="4 3"/>
<text class="t" x="85" y="323" text-anchor="middle" fill="#72243E">Parent unit</text>
<text class="s" x="85" y="342" text-anchor="middle" fill="#993556">Arduino – not decided</text>
<line class="pub" x1="150" y1="118" x2="256" y2="129" marker-end="url(#ap)"/>
<line class="pub" x1="150" y1="130" x2="256" y2="178" marker-end="url(#ap)"/>
<line class="pub" x1="150" y1="142" x2="256" y2="226" marker-end="url(#ap)"/>
<text class="s" x="203" y="112" text-anchor="middle" fill="#D85A30">publish</text>
<line class="sub" x1="260" y1="140" x2="110" y2="296" marker-end="url(#as)"/>
<line class="sub" x1="260" y1="285" x2="140" y2="298" marker-end="url(#as)"/>
<line class="sub" x1="260" y1="330" x2="154" y2="328" marker-end="url(#as)"/>
<text class="s" x="60" y="262" text-anchor="middle" fill="#1D9E75">subscribe / read</text>
<line class="sub" x1="420" y1="130" x2="517" y2="232" marker-end="url(#as)"/>
<line class="sub" x1="420" y1="180" x2="517" y2="242" marker-end="url(#as)"/>
<line class="sub" x1="420" y1="230" x2="517" y2="252" marker-end="url(#as)"/>
<text class="s" x="490" y="140" text-anchor="middle" fill="#1D9E75">subscribe child/#</text>
<line class="pub" x1="520" y1="262" x2="424" y2="280" marker-end="url(#ap)"/>
<line class="pub" x1="520" y1="275" x2="424" y2="328" marker-end="url(#ap)"/>
<text class="s" x="485" y="328" text-anchor="middle" fill="#D85A30">publish</text>
<rect x="520" y="227" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/>
<text class="t" x="590" y="250" text-anchor="middle" fill="#3C3489">Backend C#</text>
<text class="s" x="590" y="269" text-anchor="middle" fill="#534AB7">MQTTnet, Neon</text>
<text class="s" x="660" y="185" text-anchor="end" fill="#5F5E5A">No telemetry 60 s</text>
<text class="s" x="660" y="200" text-anchor="end" fill="#5F5E5A">→ offline alarm</text>
<rect x="520" y="340" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/>
<text class="t" x="590" y="363" text-anchor="middle" fill="#3C3489">Website</text>
<text class="s" x="590" y="382" text-anchor="middle" fill="#534AB7">API + JWT</text>
<line x1="590" y1="286" x2="590" y2="337" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
<text class="s" x="580" y="316" text-anchor="end" fill="#5F5E5A">HTTP API</text>
</svg>
