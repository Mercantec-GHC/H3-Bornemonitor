<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="Helvetica, Arial, sans-serif">
<title>Børnemonitor – MQTT publish / subscribe</title>
<defs><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
.t{font-size:14px;font-weight:500}.s{font-size:12px}
.pub{stroke:#D85A30;stroke-width:1.5}.sub{stroke:#1D9E75;stroke-width:1.2;stroke-dasharray:4 3}
.topic{fill:#ffffff;stroke:#888780;stroke-width:.5}
</style>
<rect width="680" height="410" fill="#ffffff"/>
<rect x="245" y="45" width="190" height="290" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="t" x="340" y="75" text-anchor="middle" fill="#444441">EMQX broker</text>
<g fill="#2C2C2A" text-anchor="middle" class="s">
<rect class="topic" x="260" y="120" width="160" height="30" rx="4"/><text x="340" y="139">child/telemetry</text>
<rect class="topic" x="260" y="175" width="160" height="30" rx="4"/><text x="340" y="194">child/event/duration</text>
<rect class="topic" x="260" y="230" width="160" height="30" rx="4"/><text x="340" y="249">child/event/instant</text>
<rect class="topic" x="260" y="285" width="160" height="30" rx="4"/><text x="340" y="304">child/status (retained)</text>
</g>
<rect x="20" y="100" width="130" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width=".5"/>
<text class="t" x="85" y="123" text-anchor="middle" fill="#72243E">Child unit</text>
<text class="s" x="85" y="142" text-anchor="middle" fill="#993556">Arduino, publisher</text>
<text class="s" x="20" y="176" fill="#5F5E5A">Buttons: sleep, walk,</text>
<text class="s" x="20" y="191" fill="#5F5E5A">eat, diaper</text>
<rect x="20" y="290" width="130" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width=".5"/>
<text class="t" x="85" y="313" text-anchor="middle" fill="#72243E">Parent unit</text>
<text class="s" x="85" y="332" text-anchor="middle" fill="#993556">Arduino, subscriber</text>
<line class="pub" x1="150" y1="118" x2="256" y2="134" marker-end="url(#ap)"/>
<line class="pub" x1="150" y1="130" x2="256" y2="189" marker-end="url(#ap)"/>
<line class="pub" x1="150" y1="142" x2="256" y2="243" marker-end="url(#ap)"/>
<text class="s" x="203" y="112" text-anchor="middle" fill="#D85A30">publish</text>
<line class="sub" x1="260" y1="145" x2="100" y2="286" marker-end="url(#as)"/>
<line class="sub" x1="260" y1="200" x2="118" y2="286" marker-end="url(#as)"/>
<line class="sub" x1="260" y1="255" x2="136" y2="288" marker-end="url(#as)"/>
<line class="sub" x1="260" y1="305" x2="154" y2="315" marker-end="url(#as)"/>
<text class="s" x="60" y="262" text-anchor="middle" fill="#1D9E75">subscribe / read</text>
<line class="sub" x1="420" y1="135" x2="517" y2="228" marker-end="url(#as)"/>
<line class="sub" x1="420" y1="190" x2="517" y2="238" marker-end="url(#as)"/>
<line class="sub" x1="420" y1="245" x2="517" y2="250" marker-end="url(#as)"/>
<text class="s" x="500" y="150" text-anchor="middle" fill="#1D9E75">subscribe / read</text>
<line class="pub" x1="520" y1="265" x2="424" y2="298" marker-end="url(#ap)"/>
<text class="s" x="490" y="305" text-anchor="middle" fill="#D85A30">publish</text>
<rect x="520" y="220" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/>
<text class="t" x="590" y="243" text-anchor="middle" fill="#3C3489">Backend C#</text>
<text class="s" x="590" y="262" text-anchor="middle" fill="#534AB7">MQTTnet, Neon</text>
<text class="s" x="660" y="185" text-anchor="end" fill="#5F5E5A">No telemetry 60 s</text>
<text class="s" x="660" y="200" text-anchor="end" fill="#5F5E5A">→ status offline</text>
<rect x="520" y="340" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width=".5"/>
<text class="t" x="590" y="363" text-anchor="middle" fill="#3C3489">Website</text>
<text class="s" x="590" y="382" text-anchor="middle" fill="#534AB7">API + JWT</text>
<line x1="590" y1="279" x2="590" y2="337" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
<text class="s" x="580" y="324" text-anchor="end" fill="#5F5E5A">HTTP API</text>
</svg>
